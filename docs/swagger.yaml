      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.StockOnHandResponseDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
